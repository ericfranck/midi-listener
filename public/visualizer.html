<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDI Visualizer</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }
        #pixi-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        #pixi-canvas {
            display: block;
            background: #0B1019;
            box-shadow: 0 0 32px #000a;
            aspect-ratio: 16 / 10;
            width: 100vw;
            height: auto;
            max-width: 100vw;
            max-height: 100vh;
        }
        @media (min-aspect-ratio: 16/10) {
            #pixi-canvas {
                width: auto;
                height: 100vh;
            }
        }
    </style>
</head>
<body>
    <div id="pixi-container"></div>
    <script src="app.bundle.js"></script>
</body>
</html>
